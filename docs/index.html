<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone 18 Pro — HK Stock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/liuchiwai0101/Others@cursor/iphone-18-stock-bot-1629/docs/style.css?v=live2">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__brand">
        <span class="header__badge">HK</span>
        <div>
          <h1>iPhone 18 Pro Stock</h1>
          <p class="header__subtitle">18 Pro &amp; 18 Pro Max · Apple Store Hong Kong · pickup &amp; delivery</p>
        </div>
      </div>
      <div class="header__status" id="statusBar">
        <span class="status-dot status-dot--idle" id="statusDot"></span>
        <span id="statusText">Ready</span>
      </div>
    </header>

    <main class="layout">
      <aside class="panel panel--controls">
        <h2>Filters</h2>

        <fieldset class="field field--compact">
          <legend>Models</legend>
          <div class="chip-group" id="modelChips"></div>
        </fieldset>

        <fieldset class="field field--compact">
          <legend>Storage</legend>
          <div class="chip-group" id="storageChips"></div>
        </fieldset>

        <fieldset class="field field--compact">
          <legend>Colour</legend>
          <div class="chip-group" id="colorChips"></div>
        </fieldset>

        <fieldset class="field field--toggles">
          <label class="toggle">
            <input type="checkbox" id="checkPickup" checked>
            <span>Pickup</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="checkDelivery" checked>
            <span>Delivery</span>
          </label>
        </fieldset>

        <label class="field field--compact">
          <span>Refresh <strong id="intervalLabel">30s</strong></span>
          <input type="range" id="intervalRange" min="15" max="120" step="5" value="30">
        </label>

        <div class="actions actions--compact">
          <button class="btn btn--primary" id="checkBtn">Check</button>
          <button class="btn btn--secondary" id="watchBtn">Watch</button>
          <button class="btn btn--ghost" id="notifyBtn">Notify</button>
        </div>
      </aside>

      <section class="panel panel--results">
        <div class="summary" id="summaryCards">
          <div class="summary-card">
            <span class="summary-card__label">Models in stock</span>
            <span class="summary-card__value" id="modelsInStock">—</span>
          </div>
          <div class="summary-card">
            <span class="summary-card__label">Pickup slots</span>
            <span class="summary-card__value" id="pickupAvailable">—</span>
          </div>
          <div class="summary-card">
            <span class="summary-card__label">Variants checked</span>
            <span class="summary-card__value" id="variantCount">—</span>
          </div>
          <div class="summary-card">
            <span class="summary-card__label">Last checked</span>
            <span class="summary-card__value summary-card__value--small" id="lastChecked">—</span>
          </div>
        </div>

        <div class="errors hidden" id="errorBox"></div>

        <section class="models-section">
          <div class="section-head">
            <h2>Availability</h2>
            <span class="section-meta" id="modelsMeta"></span>
          </div>
          <div class="models-list" id="modelsList">
            <p class="placeholder">Run a check to see iPhone 18 Pro and 18 Pro Max availability.</p>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script>
    // Assets are loaded from GitHub raw / jsDelivr inside app.js.
    window.STOCK_ASSET_BASE = "";
  </script>
  <script src="https://cdn.jsdelivr.net/gh/liuchiwai0101/Others@cursor/iphone-18-stock-bot-1629/docs/app.js?v=live2"></script>
</body>
</html>
