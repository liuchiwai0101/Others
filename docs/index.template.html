<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>iPhone HK Stock</title>
  <style>
/*INLINE_CSS*/
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__brand">
        <span class="header__badge">HK</span>
        <div>
          <h1>iPhone HK Stock</h1>
          <p class="header__subtitle">Duo, 18 Pro &amp; 18 Pro Max · Apple Store Hong Kong · pickup &amp; delivery</p>
        </div>
      </div>
      <div class="header__status" id="statusBar">
        <span class="status-dot status-dot--loading" id="statusDot"></span>
        <span id="statusText">Loading…</span>
      </div>
    </header>

    <main class="layout">
      <aside class="panel panel--controls">
        <h2>Filters</h2>

        <fieldset class="field field--compact">
          <legend>Models</legend>
          <div class="chip-group" id="modelChips"></div>
        </fieldset>

        <fieldset class="field field--compact">
          <legend>Storage</legend>
          <div class="chip-group" id="storageChips"></div>
        </fieldset>

        <fieldset class="field field--compact">
          <legend>Colour</legend>
          <div class="chip-group" id="colorChips"></div>
        </fieldset>

        <label class="field field--compact">
          <span>Refresh <strong id="intervalLabel">30s</strong></span>
          <input type="range" id="intervalRange" min="15" max="120" step="5" value="30">
        </label>

        <div class="actions actions--compact">
          <button class="btn btn--primary" id="checkBtn" type="button">Check</button>
          <button class="btn btn--secondary" id="watchBtn" type="button">Watch</button>
          <button class="btn btn--ghost" id="notifyBtn" type="button">Notify</button>
        </div>
      </aside>

      <section class="panel panel--results">
        <div class="summary" id="summaryCards">
          <div class="summary-card">
            <span class="summary-card__label">Models in stock</span>
            <span class="summary-card__value" id="modelsInStock">—</span>
          </div>
          <div class="summary-card">
            <span class="summary-card__label">Pickup slots</span>
            <span class="summary-card__value" id="pickupAvailable">—</span>
          </div>
          <div class="summary-card">
            <span class="summary-card__label">Variants checked</span>
            <span class="summary-card__value" id="variantCount">—</span>
          </div>
          <div class="summary-card">
            <span class="summary-card__label">Last checked</span>
            <span class="summary-card__value summary-card__value--small" id="lastChecked">—</span>
          </div>
        </div>

        <div class="errors hidden" id="errorBox"></div>

        <section class="models-section">
          <div class="section-head">
            <h2>Availability</h2>
            <span class="section-meta" id="modelsMeta"></span>
          </div>
          <div class="models-list" id="modelsList">
            <p class="placeholder">Loading iPhone Duo, 18 Pro and 18 Pro Max availability…</p>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script type="application/json" id="embedded-catalog">
/*EMBEDDED_CATALOG*/
  </script>
  <script type="application/json" id="embedded-stock">
/*EMBEDDED_STOCK*/
  </script>
  <script>
/*INLINE_JS*/
  </script>
</body>
</html>
